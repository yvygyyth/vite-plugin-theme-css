<!doctype html>
<html lang="zh-CN" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>theme-css playground</title>
    </head>
    <body>
        <main class="card">
            <h1 class="title">vite-plugin-theme-css playground</h1>
            <p class="desc">改 <code>playground/theme.config.ts</code> 保存可看热更新</p>
